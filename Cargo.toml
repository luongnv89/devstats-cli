[package]
name = "devstats"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Contribution stats for every contributor across GitHub organizations, in the terminal or as an HTML report"
license = "MIT"
readme = "README.md"
keywords = ["github", "contributors", "statistics", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "devstats"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anstyle = "1"
unicode-width = "0.2"
terminal_size = "0.4"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
mockito = "1"
tempfile = "3"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
lto = true
strip = true
